name: Deploy web app

# The synth is a fully static build; GitHub Pages hosts it as the web app.
# One-time setup before the first successful run:
#   Settings -> Pages -> Source: "GitHub Actions"
# Note: on a free personal plan GitHub serves Pages only from PUBLIC repos;
# a private repo needs Pro, or make the repo public.

on:
  push:
    branches: [main, "claude/synthonos-repo-r0a9jy"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build for Pages
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
