name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Every parameter is defined once in params.schema.json. If any
      # generated file is stale, the build stops here.
      - name: Codegen drift check
        run: npm run codegen:check

      - name: Typecheck
        run: npm run typecheck

      # Includes the spectral harness self-tests, the real-time safety scan
      # of src/dsp, and the golden render comparison.
      - name: Tests
        run: npm test

  # Audio-match analysis service (python/synthmatch). Needs Node too: the
  # optimizer renders candidates through the real engine via npx tsx.
  python-match:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python/requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: pip install -r python/requirements.txt

      # Includes the recovery test: a target with known params is rendered
      # through the real engine and a small search must converge toward it.
      - name: Python tests
        run: python3 -m pytest python/tests -x -q
