[package]
name = "synthonos"
version = "0.1.0"
description = "Natural language controlled virtual analog synthesizer"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "synthonos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
