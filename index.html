    THESIS: Color is information, never decoration: the grammar of DJ
    performance software, where every hue on screen means something
    (frequency band, macro identity, engine section). Refuses the
    category default of a dark plugin panel with one glowing accent.
    OWN-WORLD: Layered slate decks (#101215 to #262a30) seamed by 1px
    lines; tri-band frequency color, low red / mid green / high blue;
    eight hot-cue hues for the eight macros; Barlow, Barlow Condensed
    caps, Spline Sans Mono data readouts.
    STORY: A beginner types a sentence, watches each knob burn its own
    color while the machine turns it, and learns which color does what.
    FIRST VIEWPORT: Describe lane on top; full-width tri-band spectrum
    beside a white-phosphor waveform; eight color-keyed macros center;
    crate library left; piano deck across the bottom.
    FORM: DJ deck grammar (Serato / Traktor / Rekordbox), candidate 5 of
    7, seed dec7a09b, code-led.
    FINISH: unreviewed and undocumented is unfinished; this build ends
    with the finish review, the verdict, and DESIGN.md
