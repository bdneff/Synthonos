    <!--
    THESIS: A 1982 polyphonic flagship's front panel: the machine
    explains itself in silkscreen, and one rainbow signature indexes
    the eight macros. Refuses the category default that renders "80s
    retro" as a synthwave neon grid, and the dark-plugin-with-one-
    glowing-accent shell.
    OWN-WORLD: Matte black painted-steel panel ramp; white silkscreen
    legends and 1px frame rules; the eight-hue rainbow pinstripe band
    running the full panel width; tactile switch buttons with LED dots;
    red LED segment readouts set in DSEG; Michroma extended-tech
    wordmark; Barlow Condensed silkscreen caps.
    STORY: A beginner types a sentence and the flagship obeys: LEDs
    light where the machine is working, and the rainbow strip teaches
    which color belongs to which macro.
    FIRST VIEWPORT: Wordmark plate + describe programmer line across
    the top rail; the symmetric console center (macro Bank A, the
    instrument cluster of spectrum over scope with the patch LED
    window, macro Bank B); the rack toggle rail; the patch bank of
    named switch caps; the full-width rainbow pinstripe over the
    keybed (the Jupiter-8's own placement, ratified).
    FORM: Roland Jupiter-8 front-panel grammar, candidate 1 of 7, seed
    10f477f8, code-led.
    FINISH: unreviewed and undocumented is unfinished; this build ends
    with the finish review, the verdict, and DESIGN.md
    -->
